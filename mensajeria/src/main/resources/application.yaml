server:
  port: 8084

spring:
  application:
    name: mensajeria
  config:
    # Credenciales de Twilio para enviar SMS reales (archivo propio, no se sube a git). Ver sms.properties.example
    import: optional:file:./sms.properties
  profiles:
    default: local
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  web:
    resources:
      static-locations: classpath:/front/

cors:
  allowed-origins: >-
    http://localhost:8081,http://127.0.0.1:8081,http://localhost:8082,http://127.0.0.1:8082,
    http://localhost:8083,http://127.0.0.1:8083,http://localhost:8084,http://127.0.0.1:8084,
    http://localhost:5500,http://127.0.0.1:5500,http://localhost:8383,http://127.0.0.1:8383

# Credenciales de Twilio (en mensajeria/sms.properties o en variables de entorno). Sin ellas los SMS se rechazan con error.
twilio:
  base-url: https://api.twilio.com
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  from-number: ${TWILIO_FROM_NUMBER:}
  # Twilio Verify (sirve con la cuenta gratis): Twilio genera, envía y valida el código de entrega.
  verify-base-url: https://verify.twilio.com
  verify-service-sid: ${TWILIO_VERIFY_SERVICE_SID:}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

---
spring:
  config:
    activate:
      on-profile: local
jwt:
  secret: ${JWT_SECRET:plazoleta-local-jwt-secret-cambiar-en-produccion-2026}
sms:
  provider: ${SMS_PROVIDER:auto}

---
spring:
  config:
    activate:
      on-profile: prod
jwt:
  secret: ${JWT_SECRET}
sms:
  provider: ${SMS_PROVIDER:twilio}
