server:
  port: 8081

spring:
  application:
    name: usuarios
  profiles:
    default: local
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  web:
    resources:
      static-locations: classpath:/front/
  jpa:
    open-in-view: false

jwt:
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}

cors:
  allowed-origins: >-
    http://localhost:8081,http://127.0.0.1:8081,http://localhost:8082,http://127.0.0.1:8082,
    http://localhost:8083,http://127.0.0.1:8083,http://localhost:8084,http://127.0.0.1:8084,
    http://localhost:5500,http://127.0.0.1:5500,http://localhost:8383,http://127.0.0.1:8383

seed:
  enabled: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:file:./data/usuarios;AUTO_SERVER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
      path: /h2-console
jwt:
  secret: ${JWT_SECRET:plazoleta-local-jwt-secret-cambiar-en-produccion-2026}

seed:
  # Celular que se asigna a todos los CLIENTES en cada arranque, para que los PIN de prueba lleguen a un solo teléfono.
  # El personal usa el de la empresa (3022249736). Déjalo vacío (CELULAR_CLIENTES=) para que cada cliente conserve el suyo.
  celular-para-clientes: ${CELULAR_CLIENTES:3023066544}
---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
jwt:
  secret: ${JWT_SECRET}
