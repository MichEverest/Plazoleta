server:
  port: 8082

spring:
  application:
    name: plazoleta
  profiles:
    default: local
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  jpa:
    open-in-view: false
  web:
    resources:
      static-locations: classpath:/front/

services:
  usuarios:
    url: ${USUARIOS_URL:http://localhost:8081}
  mensajeria:
    url: ${MENSAJERIA_URL:http://localhost:8084}
  trazabilidad:
    url: ${TRAZABILIDAD_URL:http://localhost:8083}

cors:
  allowed-origins: http://localhost:8082,http://127.0.0.1:8082,http://localhost:5500,http://127.0.0.1:5500,http://localhost:8383,http://127.0.0.1:8383

seed:
  enabled: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:file:./data/plazoleta
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
      path: /h2-console
jwt:
  secret: ${JWT_SECRET:plazoleta-local-jwt-secret-cambiar-en-produccion-2026}

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
jwt:
  secret: ${JWT_SECRET}
